name: Droidective
options:
  bundleIdPrefix: com.rohindh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ADBKit:
    path: ADBKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.13.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.3
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.18.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.61.0
targets:
  App:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - scrcpy-server
          - ffmpeg
      # Extension-less binaries: force them into the resources phase so they land
      # in the .app bundle (XcodeGen otherwise can't infer the build phase).
      # scrcpy-server is pushed to the device; ffmpeg runs on the Mac for the
      # video editor. See BundledTools + scripts/update-bundled-tools.sh.
      - path: App/Resources/scrcpy-server
        buildPhase: resources
      - path: App/Resources/ffmpeg
        buildPhase: resources
      - path: App/Resources/bundletool-all.jar
        buildPhase: resources
      - path: App/Resources/uber-apk-signer.jar
        buildPhase: resources
    dependencies:
      - package: ADBKit
        product: ADBKit
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Rohindh R"
        SentryDSN: $(SENTRY_DSN)
        PostHogKey: $(POSTHOG_KEY)
        SUFeedURL: https://droidective.com/appcast.xml
        SUPublicEDKey: "ma0kTe35r55/PKmemQOEBX7n6SuZPZjOBo973SdJqJ8="
        SUEnableAutomaticChecks: true
        # Silent background downloads by default — the pill offers "Relaunch
        # to update"; quitting installs it anyway. Settings ▸ Updates can turn
        # this off (checks keep running, updates then wait for a go-ahead).
        SUAutomaticallyUpdate: true
        # Hourly (Sparkle's minimum), plus an explicit check on every launch —
        # see UpdaterViewModel.init.
        SUScheduledCheckInterval: 3600
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apk
          - UTTypeIdentifier: com.android.app-bundle
            UTTypeDescription: Android App Bundle
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - aab
        # The app's private drag types (DragTypes.swift). macOS only writes a
        # custom UTI to the drag pasteboard when the app declares it, so an
        # undeclared type makes every .onDrag with it die silently — no drop
        # target ever matches.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rohindh.droidective.workspace-tab
            UTTypeDescription: Droidective workspace tab
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.rohindh.droidective.terminal-rail-item
            UTTypeDescription: Droidective terminal rail item
            UTTypeConformsTo:
              - public.data
        CFBundleDocumentTypes:
          - CFBundleTypeName: Android Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.android.package-archive
          - CFBundleTypeName: Android App Bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.android.app-bundle
    settings:
      base:
        PRODUCT_NAME: Droidective
        PRODUCT_BUNDLE_IDENTIFIER: com.rohindh.droidective
        SENTRY_DSN: ""
        POSTHOG_KEY: ""
        MARKETING_VERSION: "3.6.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Enforce the zero-warnings policy for first-party App code. Scoped to
        # this target's sources — SPM dependencies build with their own settings.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
  AppTests:
    type: bundle.unit-test
    platform: macOS
    # A logic-test bundle (no app host to launch): it compiles the pure
    # App-layer sources under test directly, so decision logic like LaunchPrompt
    # is tested fast and deterministically. Genuinely UI-coupled coordinators
    # would need a hosted/XCUITest target instead.
    sources:
      - App/Tests
      - App/Sources/State/LaunchPrompt.swift
      - App/Sources/Theme.swift
      - App/Sources/LogScrollGeometry.swift
      - App/Sources/FeatureDetail/Views/Mirror/MirrorTabPolicy.swift
    dependencies:
      # Theme.swift's fill styles call into WindowEffects (ADBKit).
      - package: ADBKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohindh.droidective.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
