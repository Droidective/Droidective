name: Droidective
options:
  bundleIdPrefix: com.rohindh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  ADBKit:
    path: ADBKit
  ReactotronMCP:
    path: ReactotronMCP
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.13.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.3
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.18.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.61.0
targets:
  App:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes:
          - scrcpy-server
          - ffmpeg
          # The compressed source of the ffmpeg binary — unpacked at generate
          # time, must not itself ship in the bundle.
          - ffmpeg.zip
      # Extension-less binaries: force them into the resources phase so they land
      # in the .app bundle (XcodeGen otherwise can't infer the build phase).
      # scrcpy-server is pushed to the device; ffmpeg runs on the Mac for the
      # video editor. See BundledTools + scripts/update-bundled-tools.sh.
      # ffmpeg is unpacked from the committed ffmpeg.zip by
      # scripts/unpack-ffmpeg.sh (run it before a bare `xcodegen generate`;
      # `make generate` and CI already do).
      - path: App/Resources/scrcpy-server
        buildPhase: resources
      - path: App/Resources/ffmpeg
        buildPhase: resources
      - path: App/Resources/bundletool-all.jar
        buildPhase: resources
      - path: App/Resources/uber-apk-signer.jar
        buildPhase: resources
    dependencies:
      - package: ADBKit
        product: ADBKit
      - package: ReactotronMCP
        product: ReactotronMCP
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
      - package: Sentry
        product: Sentry
      - package: PostHog
        product: PostHog
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Rohindh R"
        # Screen recordings can mix in the Mac's microphone (Screen Record ▸
        # Audio). macOS shows this the first time that's switched on.
        NSMicrophoneUsageDescription:
          "Droidective records your microphone into screen recordings when you
          choose to include it, so you can narrate what the device is doing."
        SentryDSN: $(SENTRY_DSN)
        PostHogKey: $(POSTHOG_KEY)
        SUFeedURL: https://droidective.com/appcast.xml
        SUPublicEDKey: "ma0kTe35r55/PKmemQOEBX7n6SuZPZjOBo973SdJqJ8="
        SUEnableAutomaticChecks: true
        # Silent background downloads by default — the pill offers "Relaunch
        # to update"; quitting installs it anyway. Settings ▸ Updates can turn
        # this off (checks keep running, updates then wait for a go-ahead).
        SUAutomaticallyUpdate: true
        # Hourly (Sparkle's minimum), plus an explicit check on every launch —
        # see UpdaterViewModel.init.
        SUScheduledCheckInterval: 3600
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.android.package-archive
            UTTypeDescription: Android Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apk
          - UTTypeIdentifier: com.android.app-bundle
            UTTypeDescription: Android App Bundle
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - aab
          # The split-app containers. None of the three has a UTI published by
          # its producer, so these are the conventional identifiers — declared
          # as imported (the formats are theirs, not ours) and conforming to
          # public.data like the APK entry above, so they don't get swept up by
          # every app that accepts a zip.
          - UTTypeIdentifier: com.android.apks
            UTTypeDescription: Android APK Set
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apks
          - UTTypeIdentifier: com.apkpure.xapk
            UTTypeDescription: XAPK Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - xapk
          - UTTypeIdentifier: com.apkmirror.apkm
            UTTypeDescription: APKM Package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - apkm
          # The video containers macOS has no type for. The rest of
          # VideoInputFormat resolves to an Apple identifier (public.mpeg-4,
          # com.apple.quicktime-movie, public.avi, public.mpeg,
          # public.mpeg-2-transport-stream, public.avchd-mpeg-2-transport-stream,
          # public.3gpp, com.microsoft.windows-media-wmv, com.compuserve.gif)
          # and needs nothing here.
          #
          # These four are only ever declared by whichever media player happens
          # to be installed — on a Mac with IINA, `.mkv` resolves to
          # `io.iina.mkv` — so relying on the system's answer means the format
          # silently vanishes from the open panel on a Mac without that app.
          # Declared as *imported* (the formats are theirs, not ours) with the
          # conventional identifiers, conforming to public.movie so they read as
          # video everywhere rather than as opaque data.
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo:
              - public.movie
            UTTypeTagSpecification:
              public.filename-extension:
                - mkv
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo:
              - public.movie
            UTTypeTagSpecification:
              public.filename-extension:
                - webm
          - UTTypeIdentifier: com.adobe.flash.video
            UTTypeDescription: Flash Video
            UTTypeConformsTo:
              - public.movie
            UTTypeTagSpecification:
              public.filename-extension:
                - flv
          - UTTypeIdentifier: org.xiph.ogv
            UTTypeDescription: Ogg Video
            UTTypeConformsTo:
              - public.movie
            UTTypeTagSpecification:
              public.filename-extension:
                - ogv
        # The app's private drag types (DragTypes.swift). macOS only writes a
        # custom UTI to the drag pasteboard when the app declares it, so an
        # undeclared type makes every .onDrag with it die silently — no drop
        # target ever matches.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rohindh.droidective.workspace-tab
            UTTypeDescription: Droidective workspace tab
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.rohindh.droidective.terminal-rail-item
            UTTypeDescription: Droidective terminal rail item
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.rohindh.droidective.mirror-wall-tile
            UTTypeDescription: Droidective mirror wall tile
            UTTypeConformsTo:
              - public.data
        CFBundleDocumentTypes:
          - CFBundleTypeName: Android Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.android.package-archive
          - CFBundleTypeName: Android App Bundle
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.android.app-bundle
          - CFBundleTypeName: Android Split App Package
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.android.apks
              - com.apkpure.xapk
              - com.apkmirror.apkm
          # Every container the Video Editor opens (VideoInputFormat), so a
          # video can be sent here from Finder.
          #
          # Rank is **Alternate**, not Owner: Droidective joins the "Open With"
          # menu without taking .mp4 and .mov away from QuickTime. Owner here
          # would make a debugging tool the default video player on the machine.
          #
          - CFBundleTypeName: Video
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.mpeg-4
              - com.apple.quicktime-movie
              - com.apple.m4v-video
              - org.matroska.mkv
              - org.webmproject.webm
              - public.avi
              - com.adobe.flash.video
              - public.mpeg-2-transport-stream
              - public.avchd-mpeg-2-transport-stream
              - public.mpeg
              - com.microsoft.windows-media-wmv
              - public.3gpp
              - org.xiph.ogv
              - com.compuserve.gif
          # The same containers again, matched by extension instead of by
          # type — and it has to be a separate entry, because Launch Services
          # ignores CFBundleTypeExtensions in an entry that also carries
          # LSItemContentTypes.
          #
          # This is what covers a format whose extension another app owns.
          # Verified, not assumed: with IINA installed, `.mkv` resolves to
          # `io.iina.mkv`, so the `org.matroska.mkv` entry above never matches
          # and Droidective was missing from Open With for the second most
          # important format on the list. Check with
          # LSCopyApplicationURLsForURL after `lsregister -f`, not by reading
          # the plist.
          - CFBundleTypeName: Video (by extension)
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - mp4
              - mov
              - m4v
              - mkv
              - webm
              - avi
              - flv
              - ts
              - m2ts
              - mpg
              - mpeg
              - wmv
              - 3gp
              - ogv
              - gif
    settings:
      base:
        PRODUCT_NAME: Droidective
        PRODUCT_BUNDLE_IDENTIFIER: com.rohindh.droidective
        # Universal app (Intel + Apple Silicon) — pinned so a toolchain default
        # change can't silently drop a slice. Debug stays fast via
        # ONLY_ACTIVE_ARCH=YES; scripts/package-dmg.sh verifies the built
        # product carries both slices before packaging.
        ARCHS: arm64 x86_64
        SENTRY_DSN: ""
        POSTHOG_KEY: ""
        MARKETING_VERSION: "3.11.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Enforce the zero-warnings policy for first-party App code. Scoped to
        # this target's sources — SPM dependencies build with their own settings.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
  AppTests:
    type: bundle.unit-test
    platform: macOS
    # A logic-test bundle (no app host to launch): it compiles the pure
    # App-layer sources under test directly, so decision logic like LaunchPrompt
    # is tested fast and deterministically. Genuinely UI-coupled coordinators
    # would need a hosted/XCUITest target instead.
    sources:
      - App/Tests
      - App/Sources/State/LaunchPrompt.swift
      - App/Sources/Theme.swift
      - App/Sources/LogScrollGeometry.swift
      - App/Sources/Root/PaneFreezePolicy.swift
      # Whether a released tab drag becomes a new window: the three inputs
      # (accepted / cancelled / over one of our own windows) can't be exercised
      # through a real drag, so the decision is pulled out and tested here.
      - App/Sources/Root/TabDetachPolicy.swift
      # FontCatalog.derive — the picker's filter/collation/curated split.
      - App/Sources/AppFont.swift
      # The id → detail-pane table FeatureDetailView switches over, so the
      # tests can check it against the registry.
      - App/Sources/FeatureDetail/FeatureDetailRoute.swift
      - App/Sources/FeatureDetail/Views/Mirror/MirrorTabPolicy.swift
      # The persisted recording-audio choice, incl. the pre-microphone
      # single-switch migration.
      - App/Sources/FeatureDetail/Views/Record/RecordAudioPreference.swift
      # What an AVD's row says at each stage of a relaunch — the shutdown
      # wait runs for up to 20s, so its wording is the whole feedback.
      - App/Sources/FeatureDetail/Views/EmulatorRelaunchPhase.swift
      - App/Sources/FeatureDetail/Views/TourPaging.swift
      # Classifying what a drag actually carried. A folder named
      # "Something.apk" is a folder, and installing it would fail a long way
      # from the drop.
      - App/Sources/FeatureDetail/Views/Drop/DragPasteboard.swift
      - App/Sources/FeatureDetail/Views/ConsoleLinkSpanMemo.swift
      - App/Sources/FeatureDetail/Views/ConsoleRateBucket.swift
      # Which log row a click's y lands on — the rule behind ⌘-click and
      # drag-select in the Reactotron and JS Console feeds.
      - App/Sources/FeatureDetail/LogRowFrames.swift
      # The alternate-screen margin repair, tested against real SwiftTerm so a
      # dependency bump can't silently change the behavior it works around.
      - App/Sources/FeatureDetail/TerminalCompat.swift
      - App/Sources/Updates/ReleaseNotesStyler.swift
    dependencies:
      # Theme.swift's fill styles call into WindowEffects (ADBKit).
      - package: ADBKit
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohindh.droidective.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
