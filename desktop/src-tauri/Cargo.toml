[package]
name = "droidective-desktop"
version = "0.1.0"
description = "Droidective for Windows and Linux"
authors = ["Droidective"]
license = "MIT"
edition = "2021"

# Standalone, not a member of anything above it: the repo's other packages are
# SwiftPM, and an inherited workspace would only be a surprise.
[workspace]

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# Windows otherwise rejects (rust-lang/cargo#8519).
name = "droidective_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `tray-icon` is what background mode stands on: closing the window hides it,
# and the tray is the way back. On Linux that means libayatana-appindicator,
# which the .deb declares — a runtime dependency, so the class of bug only the
# smoke test finds.
# `macos-private-api` is what lets a window be transparent on macOS, which is
# where this app is developed. It costs the shipping Windows and Linux builds
# nothing — the feature compiles to nothing off Darwin — and the desktop app
# is not distributed on macOS at all, so the App Store rule it trips does not
# apply. Without it the translucent window could not be seen while building it.
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
# The supported way to spawn a bundled sidecar and own its lifetime: it
# resolves the per-platform binary location that a hand-rolled path would get
# wrong on at least one of the three targets.
tauri-plugin-shell = "2.3.5"
# The two host capabilities an action result promises: "Copy Device IP" has to
# reach the clipboard, and "saved to …" has to be openable. Both are reached
# through our own commands rather than the plugins' JS APIs, so the webview's
# capability file stays at `core:default` and gains nothing it could be
# tricked into using.
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-opener = "2.5.4"
# Install App is a file picker with an install behind it — there is no feature
# without one. Registered for its Rust API only, so the webview keeps
# `core:default` and a page cannot open a dialog on its own.
tauri-plugin-dialog = "2.7.2"
# An important result that lands while you are looking at another app has to
# say so somewhere the app is not. Rust API only, like the rest.
tauri-plugin-notification = "2.3.3"
# A recorded shortcut has to fire from wherever you are — that is what makes it
# worth recording, and it is what the Quick Actions panel is opened with.
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Loopback plain HTTP only — no TLS features, so no rustls/openssl in the tree.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time", "io-util", "net"] }
# Hand-rolling WebSocket framing (masking, continuation frames, close
# handshake) is the part of this protocol most likely to be subtly wrong.
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
thiserror = "2.0.19"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
