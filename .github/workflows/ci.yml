name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Manual runs, mainly to redo the Pages deploy with a fresh artifact when a
  # GitHub-side "Deployment failed, try again later" outlasts job reruns.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ADBKit tests
        run: cd ADBKit && swift test -Xswiftc -warnings-as-errors
      # Its own package (Apple-only), so it needs its own run.
      - name: Run ReactotronMCP tests
        run: cd ReactotronMCP && swift test -Xswiftc -warnings-as-errors
      - name: Run droidectived tests
        run: cd droidectived && swift test -Xswiftc -warnings-as-errors
      # The release channel policy — which artifacts each channel may publish,
      # and which notes a tag gets. Both failures are invisible until a release
      # is already public and signed, so they are tested on every PR.
      - name: Run release channel tests
        run: ./scripts/test-release-channel.sh

  # The Windows/Linux port rides on ADBKit staying portable (see
  # docs/cross-platform.md). Both Linux and Windows now run the full mock-driven
  # suite; ReactotronMCP is Apple-only and is not built on either.
  test-linux:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install extraction tools the suite shells out to
        run: apt-get update -q && apt-get install -y -q unzip xz-utils
      - name: Run ADBKit tests (Linux)
        run: cd ADBKit && swift test -Xswiftc -warnings-as-errors
      # The daemon is the first component whose runtime behaviour matters
      # off-Apple, so Linux runs its suite too rather than only compiling it.
      - name: Run droidectived tests (Linux)
        run: cd droidectived && swift test -Xswiftc -warnings-as-errors
      # The shipped artifact, not just the tests: a release build is a
      # different compile and must be proven before a tag depends on it.
      - name: Build droidectived (Linux, release)
        run: cd droidectived && swift build -c release --product droidectived

  build-windows:
    # windows-2022, not -2025: the 2025 image ships MSVC 14.51, whose STL header
    # yvals_core.h hard-errors with "STL1000: Unexpected compiler version,
    # expected Clang 20 or newer". The Swift 6.2.4 toolchain bundles an older
    # clang, and swift-crypto vendors BoringSSL as C/C++, so that assert fires
    # while compiling BoringSSL rather than any Swift we wrote. 2022's MSVC
    # accepts the bundled clang. Revisit when a Swift release ships clang 20+.
    runs-on: windows-2022
    steps:
      - uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5  # v0.4.0
        with:
          branch: swift-6.2.4-release
          tag: 6.2.4-RELEASE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run ADBKit tests (Windows)
        run: |
          cd ADBKit
          swift test -Xswiftc -warnings-as-errors
      # The shipped artifact, not just the library: the beta channel publishes
      # a Windows daemon, so a tag depends on this compiling.
      - name: Build droidectived (Windows, release)
        run: |
          cd droidectived
          swift build -c release --product droidectived

  # The Windows/Linux app (desktop/ — see docs/cross-platform.md phase 3).
  # Split in two so a failure says which half broke: the web half needs only
  # Node, while the native half needs Swift, Rust and a webview toolchain.
  desktop-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job builds the artifact the app ships, and a
      # poisoned cache could inject code into it (zizmor: cache-poisoning).
      # The same call the pages job already makes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Typecheck, lint, and test
        working-directory: desktop
        run: |
          npm run typecheck
          npm run lint
          npm run test
      - name: Build the frontend
        working-directory: desktop
        run: npx vite build

  desktop-native:
    runs-on: ubuntu-24.04
    # The same image test-linux uses, so the daemon the app bundles is built
    # by the compiler its own suite ran under.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Tauri build dependencies
        run: |
          apt-get update -q
          apt-get install -y -q libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        # Ubuntu's packaged toolchain is older than Tauri 2 needs, so this
        # comes from rustup rather than apt.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Tauri resolves `externalBin` at build time, so the daemon has to exist
      # before cargo runs. Building it here also proves the sidecar compiles on
      # the platform the app ships to.
      - name: Build the droidectived sidecar
        run: ./scripts/build-daemon-sidecar.sh debug
      - name: Check the Rust crate
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: |
          ./scripts/unpack-ffmpeg.sh
          xcodegen generate
          xcodebuild -project Droidective.xcodeproj -scheme App -configuration Debug -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Run App tests
        run: xcodebuild -project Droidective.xcodeproj -scheme AppTests -configuration Debug -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO

  # Publish the marketing site (and the committed Sparkle appcast) to GitHub
  # Pages on every push to main. The appcast in site/ is the single source of
  # truth — the release job commits each new version's entry back to main, which
  # re-triggers this job to deploy it.
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: this job publishes to Pages, and a poisoned cache could
      # inject code into the deployed site (zizmor: cache-poisoning).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Assemble site
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          # website/dist is the whole deployable site: Vite's publicDir points
          # at site/, so the static passthrough (CNAME, appcast.xml, sitemap,
          # SEO subpages, screenshots) is copied in alongside the React build.
          mkdir -p _site
          cp -R website/dist/. _site/
          # Reuse the app's PostHog key (a public client-side token) so the site
          # shares one project; analytics no-ops if the secret is unset. Every
          # page loads the shared analytics.js, so the key is injected once here.
          if [ -n "${POSTHOG_KEY:-}" ]; then
            sed -i "s|__POSTHOG_KEY__|${POSTHOG_KEY}|g" _site/analytics.js
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  # The beta channel's daemon artifacts. Their own job because Linux and
  # Windows binaries cannot be produced on the macOS release runner; the release
  # job downloads what this uploads.
  daemon-artifacts:
    # Beta tags only. A stable release is macOS-only, so
    # stage-release-artifacts.sh would refuse to publish a Linux or Windows
    # daemon anyway — building them for a stable tag is work nothing consumes,
    # and it put the whole release behind two runners that don't need to run.
    # Same hyphen rule release-channel.sh uses to pick the channel.
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    strategy:
      fail-fast: true
      matrix:
        include:
          # The same image test-linux already uses, rather than a third-party
          # toolchain action: one less thing in the supply chain, and the
          # release binary is built by the compiler the tests ran under.
          - os: ubuntu-24.04
            container: swift:6.2-noble
            platform: linux-x86_64
          - os: windows-2022
            container: ''
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.platform == 'windows-x86_64'
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5  # v0.4.0
        with:
          branch: swift-6.2.4-release
          tag: 6.2.4-RELEASE
      - name: Build and package droidectived
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd droidectived && swift build -c release --product droidectived)
          BIN="droidectived/.build/release/droidectived"
          [[ "${{ matrix.platform }}" == windows-x86_64 ]] && BIN="$BIN.exe"
          ./scripts/package-daemon.sh "$VERSION" "${{ matrix.platform }}" "$BIN" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: daemon-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    # A skipped dependency skips its dependents by default, and a stable tag
    # skips daemon-artifacts — so the gate names the results that are actually
    # acceptable instead. Writing an `if` at all drops the implicit success()
    # check, which is why test and build are asserted explicitly.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && !cancelled()
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && (needs['daemon-artifacts'].result == 'success'
      || needs['daemon-artifacts'].result == 'skipped')
    needs: [test, build, daemon-artifacts]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Before the expensive part. A malformed tag or a missing notes section
      # is a 10-second failure here and a ~20-minute one after build, sign, and
      # notarize have already run. release-body.md is reused by the publish and
      # appcast steps below.
      - name: Resolve the channel and this tag's notes
        run: |
          echo "publishing $GITHUB_REF_NAME on the $(./scripts/release-channel.sh channel "$GITHUB_REF_NAME") channel"
          ./scripts/release-channel.sh artifacts "$GITHUB_REF_NAME"
          ./scripts/extract-notes.sh "$GITHUB_REF_NAME" > release-body.md
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$DEVELOPER_ID_CERT_P12" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, sign, and package DMG
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/unpack-ffmpeg.sh
          xcodegen generate
          # generic/platform=macOS builds every arch in ARCHS (universal);
          # the default concrete-Mac destination builds arm64 only.
          xcodebuild -project Droidective.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath DerivedData build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SENTRY_DSN="$SENTRY_DSN" POSTHOG_KEY="$POSTHOG_KEY" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS="--timestamp" \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym
          SIGN_IDENTITY="$SIGN_IDENTITY" ./scripts/package-dmg.sh "${GITHUB_REF_NAME}"
      # Upload dSYMs so Sentry can symbolicate first-party frames in crash/app-hang
      # reports. Without this, our own frames show as <unknown>. Skips cleanly if
      # the SENTRY_AUTH_TOKEN secret is absent (e.g. forks).
      - name: Upload dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ro-is
          SENTRY_PROJECT: droidective-mac
          SENTRY_URL: https://de.sentry.io
        run: |
          [[ -n "${SENTRY_AUTH_TOKEN:-}" ]] || { echo "no SENTRY_AUTH_TOKEN secret — skipping dSYM upload"; exit 0; }
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload --wait DerivedData/Build/Products/Release
      - name: Notarize and staple
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" | openssl base64 -d -A > "$RUNNER_TEMP/ac_api.p8"
          AC_API_KEY_PATH="$RUNNER_TEMP/ac_api.p8" \
          AC_API_KEY_ID="$AC_API_KEY_ID" \
          AC_API_ISSUER_ID="$AC_API_ISSUER_ID" \
            ./scripts/notarize.sh "DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}.dmg"
          rm -f "$RUNNER_TEMP/ac_api.p8"
      # A stable-named copy backs the site's download button via the permanent
      # /releases/latest/download/Droidective.dmg URL — always the newest
      # release, no appcast fetch, no Pages/browser cache staleness. Safe on a
      # beta too: /releases/latest only ever resolves to a non-prerelease.
      - name: Add a stable-named copy for the latest-download link
        run: |
          cp "DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}.dmg" \
             "DerivedData/Build/Products/Release/Droidective.dmg"
      # The channel gate. A stable tag publishes the macOS DMG and nothing else;
      # a beta tag additionally carries the Windows and Linux artifacts once
      # they exist. Staging asserts the exact set, so a Windows build left
      # behind by an ungated job fails the stable release instead of shipping on
      # it — and the publish step can glob `dist/*` without
      # fail_on_unmatched_files breaking on the set that varies.
      # Universal, like the app: the daemon is a sidecar next to it, and an
      # arm64-only binary would break Intel Macs that the app itself supports.
      # Beta only — release-channel.sh lists the macOS daemon tarball and
      # SHA256SUMS alongside the Linux and Windows ones, so a stable tag
      # publishes neither and building them for one is ten minutes nothing
      # consumes.
      - name: Build and package droidectived (macOS universal)
        if: contains(github.ref_name, '-')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd droidectived && swift build -c release --arch arm64 --arch x86_64 \
            --product droidectived)
          ./scripts/package-daemon.sh "$VERSION" macos-universal \
            droidectived/.build/apple/Products/Release/droidectived \
            DerivedData/Build/Products/Release
      # Only a beta has them — daemon-artifacts doesn't run for a stable tag.
      - if: contains(github.ref_name, '-')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: daemon-*
          merge-multiple: true
          path: DerivedData/Build/Products/Release
      # Checksums cover exactly what ships, so they are generated after every
      # artifact is in place and before staging asserts the set. SHA256SUMS is
      # itself a beta artifact, and on a stable tag there are no archives to
      # sum — the glob would match nothing and shasum would fail the release.
      - name: Checksum the daemon archives
        if: contains(github.ref_name, '-')
        run: |
          cd DerivedData/Build/Products/Release
          shasum -a 256 droidectived-* > SHA256SUMS
          cat SHA256SUMS
      - name: Stage the artifacts this channel publishes
        run: ./scripts/stage-release-artifacts.sh "$GITHUB_REF_NAME" DerivedData/Build/Products/Release dist
      # A hyphen in the tag (v3.3.0-beta.1) marks a beta: the GitHub release is
      # a prerelease and the appcast item rides the Sparkle beta channel.
      - name: Publish release with build
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: dist/*
          body_path: release-body.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Sign update and publish appcast to main
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}.dmg"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Droidective-${GITHUB_REF_NAME}.dmg"
          ./scripts/fetch-sparkle-tools.sh
          # release-body.md (the GitHub release notes, extracted above) is
          # rendered to HTML and embedded in the appcast's <description>.
          ./scripts/update-appcast.sh "$DMG" "$VERSION" "${{ github.run_number }}" "$DOWNLOAD_URL" release-body.md "site/appcast.xml"
          # Commit the regenerated appcast back to main; the resulting push runs
          # the pages job, which deploys it. (GitHub Pages only serves deploys
          # from the source branch, so a tag-ref deploy here would never go live.)
          ./scripts/commit-appcast.sh "site/appcast.xml" "${{ github.repository }}" main "${GITHUB_REF_NAME}"
