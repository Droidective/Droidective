name: CI
on:
  push:
    # beta is the pre-release line: tags cut there ship on the Sparkle beta
    # channel without the code ever merging to main (pages stays main-only).
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  # Manual runs, mainly to redo the Pages deploy with a fresh artifact when a
  # GitHub-side "Deployment failed, try again later" outlasts job reruns.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Run ADBKit tests
        run: cd ADBKit && swift test -Xswiftc -warnings-as-errors

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: |
          ./scripts/assemble-ffmpeg.sh
          xcodegen generate
          xcodebuild -project Droidective.xcodeproj -scheme App -configuration Debug -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
      - name: Run App tests
        run: xcodebuild -project Droidective.xcodeproj -scheme AppTests -configuration Debug -derivedDataPath DerivedData test CODE_SIGNING_ALLOWED=NO

  # Publish the marketing site (and the committed Sparkle appcast) to GitHub
  # Pages on every push to main. The appcast in site/ is the single source of
  # truth — the release job commits each new version's entry back to main, which
  # re-triggers this job to deploy it.
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # No npm cache: this job publishes to Pages, and a poisoned cache could
      # inject code into the deployed site (zizmor: cache-poisoning).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build site
        working-directory: website
        run: |
          npm ci
          npm run build
      - name: Assemble site
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: |
          # website/dist is the whole deployable site: Vite's publicDir points
          # at site/, so the static passthrough (CNAME, appcast.xml, sitemap,
          # SEO subpages, screenshots) is copied in alongside the React build.
          mkdir -p _site
          cp -R website/dist/. _site/
          # Reuse the app's PostHog key (a public client-side token) so the site
          # shares one project; analytics no-ops if the secret is unset. Every
          # page loads the shared analytics.js, so the key is injected once here.
          if [ -n "${POSTHOG_KEY:-}" ]; then
            sed -i "s|__POSTHOG_KEY__|${POSTHOG_KEY}|g" _site/analytics.js
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$DEVELOPER_ID_CERT_P12" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, sign, and package per-arch DMGs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          xcodegen generate
          # One thin build per architecture (issue #174: releases used to be
          # arm64-only and Intel Macs refused to launch them). Each build
          # bundles its own ffmpeg slice and bakes its own Sparkle feed —
          # arm64 keeps the legacy appcast.xml every installed 3.x app reads.
          for ARCH in arm64 x86_64; do
            FEED="https://droidective.com/appcast.xml"
            [[ "$ARCH" == "x86_64" ]] && FEED="https://droidective.com/appcast-x86_64.xml"
            ./scripts/assemble-ffmpeg.sh "$ARCH"
            xcodebuild -project Droidective.xcodeproj -scheme App -configuration Release \
              -derivedDataPath DerivedData build \
              ARCHS="$ARCH" ONLY_ACTIVE_ARCH=NO SPARKLE_FEED_URL="$FEED" \
              MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              SENTRY_DSN="$SENTRY_DSN" POSTHOG_KEY="$POSTHOG_KEY" \
              CODE_SIGN_IDENTITY="$SIGN_IDENTITY" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              CODE_SIGN_STYLE=Manual ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS="--timestamp" \
              DEBUG_INFORMATION_FORMAT=dwarf-with-dsym
            # Every Mach-O must carry the target arch, or support for that
            # CPU silently regresses the next time a bundled tool updates.
            ./scripts/check-archs.sh DerivedData/Build/Products/Release/Droidective.app "$ARCH"
            SIGN_IDENTITY="$SIGN_IDENTITY" ./scripts/package-dmg.sh "${GITHUB_REF_NAME}" "$ARCH"
            # Stash this arch's dSYMs before the next build overwrites them.
            mkdir -p "dsyms/$ARCH"
            cp -R DerivedData/Build/Products/Release/*.dSYM "dsyms/$ARCH/"
          done
      # Upload dSYMs so Sentry can symbolicate first-party frames in crash/app-hang
      # reports. Without this, our own frames show as <unknown>. Skips cleanly if
      # the SENTRY_AUTH_TOKEN secret is absent (e.g. forks).
      - name: Upload dSYMs to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ro-is
          SENTRY_PROJECT: droidective-mac
          SENTRY_URL: https://de.sentry.io
        run: |
          [[ -n "${SENTRY_AUTH_TOKEN:-}" ]] || { echo "no SENTRY_AUTH_TOKEN secret — skipping dSYM upload"; exit 0; }
          brew install getsentry/tools/sentry-cli
          # Both arch builds' dSYMs — stashed per arch during the build loop.
          sentry-cli debug-files upload --wait dsyms
      - name: Notarize and staple
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          echo "$AC_API_KEY_P8" | openssl base64 -d -A > "$RUNNER_TEMP/ac_api.p8"
          for ARCH in arm64 x86_64; do
            AC_API_KEY_PATH="$RUNNER_TEMP/ac_api.p8" \
            AC_API_KEY_ID="$AC_API_KEY_ID" \
            AC_API_ISSUER_ID="$AC_API_ISSUER_ID" \
              ./scripts/notarize.sh "DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}-${ARCH}.dmg"
          done
          rm -f "$RUNNER_TEMP/ac_api.p8"
      - name: Extract notes for this release
        run: awk '/^## /{c++} c==1{print} c==2{exit}' RELEASE_NOTES.md > release-body.md
      # Stable-named copies back the site's download buttons via the permanent
      # /releases/latest/download/… URLs — always the newest release, no
      # appcast fetch, no Pages/browser cache staleness. Droidective.dmg stays
      # the Apple Silicon build so every pre-split link keeps working. Safe on
      # a beta too: /releases/latest only ever resolves to a non-prerelease.
      - name: Add stable-named copies for the latest-download links
        run: |
          cp "DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}-arm64.dmg" \
             "DerivedData/Build/Products/Release/Droidective.dmg"
          cp "DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}-x86_64.dmg" \
             "DerivedData/Build/Products/Release/Droidective-x86_64.dmg"
      # A hyphen in the tag (v3.3.0-beta.1) marks a beta: the GitHub release is
      # a prerelease, the appcast item rides the Sparkle beta channel, and the
      # Homebrew cask is left alone.
      - name: Publish release with build
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: |
            DerivedData/Build/Products/Release/Droidective-*.dmg
            DerivedData/Build/Products/Release/Droidective.dmg
          body_path: release-body.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      - name: Sign update and publish appcast to main
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/fetch-sparkle-tools.sh
          # Feeds are per arch: appcast.xml is the arm64 feed (the URL every
          # installed 3.x app already reads), appcast-x86_64.xml the Intel one.
          # Start each from MAIN's live copy, not this checkout's — a beta tag
          # cut from the beta branch may carry a stale appcast, and a beta
          # item must preserve the CURRENT stable item beside it.
          for ARCH in arm64 x86_64; do
            FEED="site/appcast.xml"
            [[ "$ARCH" == "x86_64" ]] && FEED="site/appcast-x86_64.xml"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${{ github.repository }}/contents/${FEED}?ref=main" \
              > "$FEED" 2>/dev/null || rm -f "$FEED"
            DMG="DerivedData/Build/Products/Release/Droidective-${GITHUB_REF_NAME}-${ARCH}.dmg"
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/Droidective-${GITHUB_REF_NAME}-${ARCH}.dmg"
            # release-body.md (the GitHub release notes, extracted above) is
            # rendered to HTML and embedded in the appcast's <description>.
            ./scripts/update-appcast.sh "$DMG" "$VERSION" "${{ github.run_number }}" "$DOWNLOAD_URL" release-body.md "$FEED"
            # Commit the regenerated appcast back to main; the resulting push
            # runs the pages job, which deploys it. (GitHub Pages only serves
            # deploys from the source branch.)
            ./scripts/commit-appcast.sh "$FEED" "${{ github.repository }}" main "${GITHUB_REF_NAME}"
          done
      - name: Update Homebrew cask
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [[ -n "${HOMEBREW_TAP_TOKEN:-}" ]] || { echo "no HOMEBREW_TAP_TOKEN — skipping cask update"; exit 0; }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" == *-* ]] && { echo "beta release — skipping cask update"; exit 0; }
          RELEASE_DIR="DerivedData/Build/Products/Release"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Rohindh-R/homebrew-tap.git" tap
          ./scripts/update-cask.sh "$VERSION" \
            "$RELEASE_DIR/Droidective-${GITHUB_REF_NAME}-arm64.dmg" "$BASE_URL/Droidective-${GITHUB_REF_NAME}-arm64.dmg" \
            "$RELEASE_DIR/Droidective-${GITHUB_REF_NAME}-x86_64.dmg" "$BASE_URL/Droidective-${GITHUB_REF_NAME}-x86_64.dmg" \
            "tap/Casks/droidective.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/droidective.rb
          git diff --cached --quiet || git commit -m "droidective ${VERSION}"
          git push
