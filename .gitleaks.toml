# gitleaks configuration. Extends the default ruleset and allowlists strings in
# this repo that look like secrets but aren't.
[extend]
useDefault = true

[[allowlists]]
description = "Known non-secrets (public by design or not credentials)"
regexes = [
  # Sparkle EdDSA *public* key — embedded in the app to verify updates; meant to ship publicly.
  '''ma0kTe35r55/PKmemQOEBX7n6SuZPZjOBo973SdJqJ8=''',
  # UserDefaults migration key, not a credential.
  '''didMigrateDefaultsV2''',
]

[[allowlists]]
description = "Bundled third-party binaries (not secrets): scrcpy-server (Apache-2.0), ffmpeg (GPLv3)"
paths = [
  '''App/Resources/scrcpy-server''',
  '''App/Resources/ffmpeg''',
]

[[allowlists]]
description = "cURL parser test fixtures — invented credentials in command strings the parser must handle"
paths = [
  '''ADBKit/Tests/ADBKitTests/ApiCurlTests\.swift''',
  '''ADBKit/Tests/ADBKitTests/PostmanFormatTests\.swift''',
]
regexes = [
  '''alice:s3cret''',
  '''alice:a:b:c''',
  '''alice''',
  '''hunter2''',
  '''eyJhbGciOi''',
  '''tok-staging''',
]
